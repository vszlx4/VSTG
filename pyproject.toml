[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vstg"
version = "0.1.1"
description = "A pure Python, zero dependency bloom filter."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ahmed Mughram", email = "ahmed@mughram.com" },
]
keywords = ["bloom filter", "probabilistic data structure", "membership testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/vszlx4/vstg"
Repository = "https://github.com/vszlx4/vstg"
Issues = "https://github.com/vszlx4/vstg/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vstg"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP012: explicit "utf-8" in .encode() calls is a deliberate style choice
# for this project, it documents the encoding decision at each call site
# rather than relying on an implicit default.
ignore = ["UP012"]